services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      RBAC_BOOTSTRAP_USERS: ${RBAC_BOOTSTRAP_USERS:-}
    command: ["/bin/sh", "/app/nginx/migrate-up.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      OBS_OTEL_ENABLED: ${OBS_OTEL_ENABLED:-false}
      OBS_OTEL_EXPORTER_OTLP_ENDPOINT: ${OBS_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    command: ["/bin/sh", "/app/nginx/app-up.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    environment:
      APP_UPSTREAM: ${APP_UPSTREAM:-app:8000}
      AUTH_LOGIN_RATE: ${AUTH_LOGIN_RATE:-10r/m}
      AUTH_REGISTER_RATE: ${AUTH_REGISTER_RATE:-6r/m}
      AUTH_REFRESH_RATE: ${AUTH_REFRESH_RATE:-60r/m}
      NGINX_ENVSUBST_FILTER: APP_UPSTREAM|AUTH_LOGIN_RATE|AUTH_REGISTER_RATE|AUTH_REFRESH_RATE
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    profiles: ["obs"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "${OBS_OTEL_GRPC_PORT:-4317}:4317"
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    depends_on:
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "${OBS_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${OBS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

  alertmanager:
    image: prom/alertmanager:latest
    profiles: ["obs"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "${OBS_ALERTMANAGER_PORT:-9093}:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    image: grafana/loki:latest
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    ports:
      - "${OBS_LOKI_PORT:-3100}:3100"
    environment:
      LOKI_RETENTION_PERIOD: ${OBS_LOKI_RETENTION_PERIOD:-72h}
    volumes:
      - ./ops/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:latest
    profiles: ["obs"]
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "/etc/alloy/config.alloy",
      ]
    depends_on:
      loki:
        condition: service_started
    ports:
      - "${OBS_ALLOY_PORT:-12345}:12345"
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tempo:
    image: grafana/tempo:latest
    profiles: ["obs"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${OBS_TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ./ops/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

volumes:
  pg_data:
  redis_data:
  grafana_data:
  loki_data:
  tempo_data:
