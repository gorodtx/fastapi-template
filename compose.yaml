services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
    command: ["/bin/sh", "/app/nginx/migrate-up.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
    command: ["/bin/sh", "/app/nginx/app-up.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    environment:
      APP_UPSTREAM: ${APP_UPSTREAM:-app:8000}
      AUTH_LOGIN_RATE: ${AUTH_LOGIN_RATE:-10r/m}
      AUTH_REGISTER_RATE: ${AUTH_REGISTER_RATE:-6r/m}
      AUTH_REFRESH_RATE: ${AUTH_REFRESH_RATE:-60r/m}
      NGINX_ENVSUBST_FILTER: APP_UPSTREAM|AUTH_LOGIN_RATE|AUTH_REGISTER_RATE|AUTH_REFRESH_RATE
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro

volumes:
  pg_data:
  redis_data:
