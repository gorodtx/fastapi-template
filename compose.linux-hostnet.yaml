services:
  postgres:
    network_mode: host
    ports: []

  redis:
    network_mode: host
    ports: []

  migrate:
    network_mode: host
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0

  app:
    network_mode: host
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      OBS_OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:${OBS_OTEL_GRPC_PORT:-4317}

  nginx:
    network_mode: host
    ports: []
    environment:
      APP_UPSTREAM: 127.0.0.1:8000

  otel-collector:
    network_mode: host
    ports: []
    command: ["--config=/etc/otelcol-contrib/config-hostnet.yaml"]
    volumes:
      - ./ops/otel-collector/config.hostnet.yaml:/etc/otelcol-contrib/config-hostnet.yaml:ro

  prometheus:
    network_mode: host
    ports: []
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus/prometheus.hostnet.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    network_mode: host
    ports: []

  alertmanager:
    network_mode: host
    ports: []

  loki:
    network_mode: host
    ports: []

  alloy:
    network_mode: host
    ports: []

  tempo:
    network_mode: host
    ports: []
    command: ["-config.file=/etc/tempo/tempo-hostnet.yml"]
    volumes:
      - ./ops/tempo/tempo.hostnet.yml:/etc/tempo/tempo-hostnet.yml:ro
