global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "job", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: webhook-default

receivers:
  - name: webhook-default
    webhook_configs:
      - url: "http://host.docker.internal:5001/alerts"
        send_resolved: true
