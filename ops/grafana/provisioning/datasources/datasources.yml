apiVersion: 1

datasources:
  - uid: prometheus
    name: Prometheus
    type: prometheus
    access: proxy
    url: ${GRAFANA_PROMETHEUS_URL}
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id

  - uid: loki
    name: Loki
    type: loki
    access: proxy
    url: ${GRAFANA_LOKI_URL}

  - uid: prometheus_lts
    name: Prometheus (LTS)
    type: prometheus
    access: proxy
    url: ${GRAFANA_PROMETHEUS_LTS_URL}

  - uid: tempo
    name: Tempo
    type: tempo
    access: proxy
    url: ${GRAFANA_TEMPO_URL}
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags: ["service.name", "service", "job"]
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
