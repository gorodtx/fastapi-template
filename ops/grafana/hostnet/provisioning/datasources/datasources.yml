apiVersion: 1

deleteDatasources:
  - name: Tempo
    orgId: 1

datasources:
  - uid: prometheus
    name: Prometheus
    type: prometheus
    access: proxy
    url: ${GRAFANA_PROMETHEUS_URL}
    isDefault: true

  - uid: loki
    name: Loki
    type: loki
    access: proxy
    url: ${GRAFANA_LOKI_URL}

  - uid: prometheus_lts
    name: Prometheus (LTS)
    type: prometheus
    access: proxy
    url: ${GRAFANA_PROMETHEUS_LTS_URL}
