global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: template
    replica: prometheus-1

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager-1:9093", "alertmanager-2:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

remote_write:
  - url: http://victoria-metrics:8428/api/v1/write
    queue_config:
      capacity: 10000
      max_samples_per_send: 2000
      min_shards: 1
      max_shards: 10
      batch_send_deadline: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo-query-frontend:3200"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager-1:9093", "alertmanager-2:9093"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: pgbouncer-exporter
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]

  - job_name: victoria-metrics
    static_configs:
      - targets: ["victoria-metrics:8428"]
