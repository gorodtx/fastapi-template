groups:
  - name: service-recording
    interval: 30s
    rules:
      - record: service:rps:5m
        expr: sum(rate(http_server_duration_milliseconds_count[5m]))

      - record: service:error_ratio:5m
        expr: |
          sum(rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_duration_milliseconds_count[5m])), 1e-9)

      - record: service:error_ratio:1h
        expr: |
          sum(rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[1h]))
          /
          clamp_min(sum(rate(http_server_duration_milliseconds_count[1h])), 1e-9)

      - record: service:error_ratio:30m
        expr: |
          sum(rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[30m]))
          /
          clamp_min(sum(rate(http_server_duration_milliseconds_count[30m])), 1e-9)

      - record: service:error_ratio:6h
        expr: |
          sum(rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[6h]))
          /
          clamp_min(sum(rate(http_server_duration_milliseconds_count[6h])), 1e-9)

      - record: service:error_rate_5xx:5m
        expr: 100 * service:error_ratio:5m

      - record: service:latency_p95_ms:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_duration_milliseconds_bucket[5m]))
          )

  - name: dependency-recording
    interval: 30s
    rules:
      - record: dependency:db_redis_error_ratio:5m
        expr: |
          sum by (service_name, db_system) (
            rate(
              traces_spanmetrics_calls_total{
                span_kind="SPAN_KIND_CLIENT",
                status_code="STATUS_CODE_ERROR",
                db_system=~"redis|postgresql|mysql|sqlite|mssql|oracle|mongodb|cockroachdb"
              }[5m]
            )
          )
          /
          clamp_min(
            sum by (service_name, db_system) (
              rate(
                traces_spanmetrics_calls_total{
                  span_kind="SPAN_KIND_CLIENT",
                  db_system=~"redis|postgresql|mysql|sqlite|mssql|oracle|mongodb|cockroachdb"
                }[5m]
              )
            ),
            1e-9
          )

      - record: dependency:db_redis_error_rate_pct:5m
        expr: 100 * dependency:db_redis_error_ratio:5m

      - record: dependency:db_redis_latency_p95_seconds:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name, db_system) (
              rate(
                traces_spanmetrics_duration_seconds_bucket{
                  span_kind="SPAN_KIND_CLIENT",
                  db_system=~"redis|postgresql|mysql|sqlite|mssql|oracle|mongodb|cockroachdb"
                }[5m]
              )
            )
          )

  - name: postgres-recording
    interval: 30s
    rules:
      - record: db:postgres_connections_usage_pct:5m
        expr: |
          100 *
          sum(pg_stat_activity_count{server=~".*"})
          /
          clamp_min(max(pg_settings_max_connections{server=~".*"}), 1)

      - record: db:postgres_deadlocks_rate:5m
        expr: |
          sum(rate(pg_stat_database_deadlocks{datname!=""}[5m]))

      - record: db:postgres_temp_bytes_rate:5m
        expr: |
          sum(rate(pg_stat_database_temp_bytes{datname!=""}[5m]))

  - name: pgbouncer-recording
    interval: 30s
    rules:
      - record: db:pgbouncer_client_connections_usage_pct:5m
        expr: |
          100 *
          sum(
            pgbouncer_pools_client_active_connections
            +
            pgbouncer_pools_client_waiting_connections
          )
          /
          clamp_min(max(pgbouncer_config_max_client_connections), 1)

      - record: db:pgbouncer_client_waiting_connections:max
        expr: |
          max(pgbouncer_pools_client_waiting_connections)

      - record: db:pgbouncer_client_maxwait_seconds:max
        expr: |
          max(pgbouncer_pools_client_maxwait_seconds)
