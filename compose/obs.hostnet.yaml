services:
  alert-webhook-sink:
    network_mode: host
    ports: []
    command: ["-listen=:5001", "-text=ok"]

  otel-collector:
    network_mode: host
    ports: []
    command: ["--config=/etc/otelcol-contrib/config-hostnet.yaml"]
    volumes:
      - ../ops/otel-collector/config.hostnet.yaml:/etc/otelcol-contrib/config-hostnet.yaml:ro

  prometheus-1:
    network_mode: host
    ports: []
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=${OBS_PROMETHEUS_RETENTION:-24h}",
        "--web.listen-address=0.0.0.0:9090",
      ]
    volumes:
      - ../ops/prometheus/prometheus.hostnet.yml:/etc/prometheus/prometheus.yml:ro

  prometheus-2:
    network_mode: host
    ports: []
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=${OBS_PROMETHEUS_RETENTION:-24h}",
        "--web.listen-address=0.0.0.0:9091",
      ]
    volumes:
      - ../ops/prometheus/prometheus-2.hostnet.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    network_mode: host
    ports: []
    environment:
      GRAFANA_PROMETHEUS_URL: http://127.0.0.1:9090
      GRAFANA_PROMETHEUS_LTS_URL: http://127.0.0.1:8428
      GRAFANA_LOKI_URL: http://127.0.0.1:3100
      GRAFANA_TEMPO_URL: http://127.0.0.1:3200

  alertmanager-1:
    network_mode: host
    ports: []
    environment:
      ALERTMANAGER_WEB_LISTEN_ADDRESS: 0.0.0.0:9093
      ALERTMANAGER_CLUSTER_LISTEN_ADDRESS: 0.0.0.0:9094
      ALERTMANAGER_CLUSTER_PEERS: 127.0.0.1:9194
      ALERTMANAGER_WEBHOOK_TICKET_URL: ${ALERTMANAGER_WEBHOOK_TICKET_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_PAGE_URL: ${ALERTMANAGER_WEBHOOK_PAGE_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_HEARTBEAT_URL: ${ALERTMANAGER_WEBHOOK_HEARTBEAT_URL:-http://127.0.0.1:5001/alerts}

  alertmanager-2:
    network_mode: host
    ports: []
    environment:
      ALERTMANAGER_WEB_LISTEN_ADDRESS: 0.0.0.0:9193
      ALERTMANAGER_CLUSTER_LISTEN_ADDRESS: 0.0.0.0:9194
      ALERTMANAGER_CLUSTER_PEERS: 127.0.0.1:9094
      ALERTMANAGER_WEBHOOK_TICKET_URL: ${ALERTMANAGER_WEBHOOK_TICKET_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_PAGE_URL: ${ALERTMANAGER_WEBHOOK_PAGE_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_HEARTBEAT_URL: ${ALERTMANAGER_WEBHOOK_HEARTBEAT_URL:-http://127.0.0.1:5001/alerts}

  loki:
    network_mode: host
    ports: []
    environment:
      LOKI_RULER_ALERTMANAGER_URL: ${LOKI_RULER_ALERTMANAGER_URL:-http://127.0.0.1:9093}

  alloy:
    network_mode: host
    ports: []
    volumes:
      - ../ops/alloy/config.hostnet.alloy:/etc/alloy/config.alloy:ro

  tempo:
    network_mode: host
    ports: []
    command: ["-config.file=/etc/tempo/tempo-hostnet.yml"]
    volumes:
      - ../ops/tempo/tempo.hostnet.yml:/etc/tempo/tempo-hostnet.yml:ro

  victoria-metrics:
    network_mode: host
    ports: []
