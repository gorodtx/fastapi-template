services:
  app:
    environment:
      OBS_OTEL_ENABLED: "true"
      OBS_OTEL_EXPORTER_OTLP_ENDPOINT: ${OBS_OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4317}
      OBS_OTEL_EXPORTER_OTLP_HEADERS: ${OBS_OTEL_EXPORTER_OTLP_HEADERS:-authorization=Bearer dev-otel-token}

  alert-webhook-sink:
    network_mode: host
    ports: []
    command: ["-listen=:5001", "-text=ok"]

  otel-collector:
    network_mode: host
    ports: []
    command: ["--config=/etc/otelcol-contrib/config-hostnet.yaml"]
    volumes:
      - ../ops/otel-collector/config.hostnet.yaml:/etc/otelcol-contrib/config-hostnet.yaml:ro

  prometheus-1:
    network_mode: host
    ports: []
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=${OBS_PROMETHEUS_RETENTION:-24h}",
        "--web.listen-address=0.0.0.0:9090",
      ]
    volumes:
      - ../ops/prometheus/prometheus.hostnet.yml:/etc/prometheus/prometheus.yml:ro

  prometheus-2:
    network_mode: host
    ports: []
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=${OBS_PROMETHEUS_RETENTION:-24h}",
        "--web.listen-address=0.0.0.0:9091",
      ]
    volumes:
      - ../ops/prometheus/prometheus-2.hostnet.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    network_mode: host
    ports: []
    environment:
      GRAFANA_PROMETHEUS_URL: http://127.0.0.1:9090
      GRAFANA_PROMETHEUS_LTS_URL: http://127.0.0.1:8428
      GRAFANA_LOKI_URL: http://127.0.0.1:3100
      GF_PATHS_PROVISIONING: /etc/grafana/hostnet-provisioning
    volumes:
      - ../ops/grafana/hostnet/provisioning:/etc/grafana/hostnet-provisioning:ro

  alertmanager-1:
    network_mode: host
    ports: []
    environment:
      ALERTMANAGER_WEB_LISTEN_ADDRESS: 0.0.0.0:9093
      ALERTMANAGER_CLUSTER_LISTEN_ADDRESS: 0.0.0.0:9094
      ALERTMANAGER_CLUSTER_PEERS: 127.0.0.1:9194
      ALERTMANAGER_WEBHOOK_TICKET_URL: ${ALERTMANAGER_WEBHOOK_TICKET_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_PAGE_URL: ${ALERTMANAGER_WEBHOOK_PAGE_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_HEARTBEAT_URL: ${ALERTMANAGER_WEBHOOK_HEARTBEAT_URL:-http://127.0.0.1:5001/alerts}

  alertmanager-2:
    network_mode: host
    ports: []
    environment:
      ALERTMANAGER_WEB_LISTEN_ADDRESS: 0.0.0.0:9193
      ALERTMANAGER_CLUSTER_LISTEN_ADDRESS: 0.0.0.0:9194
      ALERTMANAGER_CLUSTER_PEERS: 127.0.0.1:9094
      ALERTMANAGER_WEBHOOK_TICKET_URL: ${ALERTMANAGER_WEBHOOK_TICKET_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_PAGE_URL: ${ALERTMANAGER_WEBHOOK_PAGE_URL:-http://127.0.0.1:5001/alerts}
      ALERTMANAGER_WEBHOOK_HEARTBEAT_URL: ${ALERTMANAGER_WEBHOOK_HEARTBEAT_URL:-http://127.0.0.1:5001/alerts}

  loki:
    network_mode: host
    ports: []
    environment:
      LOKI_RULER_ALERTMANAGER_URL: ${LOKI_RULER_ALERTMANAGER_URL:-http://127.0.0.1:9093}

  alloy:
    network_mode: host
    ports: []
    volumes:
      - ../ops/alloy/config.hostnet.alloy:/etc/alloy/config.alloy:ro

  postgres-exporter:
    network_mode: host
    ports: []
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN_HOSTNET:-postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable}

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.10.2
    network_mode: host
    ports: []
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: ${PGBOUNCER_EXPORTER_DSN_HOSTNET:-postgres://postgres:postgres@127.0.0.1:6432/pgbouncer?sslmode=disable}

  victoria-metrics:
    network_mode: host
    ports: []
