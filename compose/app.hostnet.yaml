services:
  app:
    network_mode: host
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      OBS_OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:${OBS_OTEL_GRPC_PORT:-4317}

  nginx:
    network_mode: host
    ports: []
    environment:
      APP_UPSTREAM: 127.0.0.1:8000
